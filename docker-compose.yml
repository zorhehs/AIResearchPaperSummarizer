services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - UNPAYWALL_EMAIL=${UNPAYWALL_EMAIL:-}
      # Keep the SQLite file (sessions, daily usage, summary cache) on the
      # mounted volume — anywhere else and it dies with the container.
      - DB_PATH=/app/data/users.db
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
